name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # eslint-suppressions.json baselines the pre-existing violations.
      # --quiet gates on errors only; new warnings stay advisory.
      - name: Lint
        run: npx eslint --quiet

      # npm audit is advisory: the current tree carries known advisories
      # (including Next.js criticals queued for a dedicated upgrade slice), and
      # blocking every push on an unfixable-in-place advisory would train
      # people to ignore CI. The log stays the forcing function.
      - name: Dependency audit (advisory)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
